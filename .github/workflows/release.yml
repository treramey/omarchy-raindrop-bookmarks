name: GitHub Release

on:
  push:
    branches: [main]

concurrency:
  group: github-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect version release
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current=$(jq -r '.version' package.json)
          manifest=$(jq -r '.version' manifest.json)
          [[ "$current" == "$manifest" ]] || {
            echo "package.json and manifest.json versions do not match" >&2
            exit 1
          }

          previous=$(git show "$BEFORE_SHA:package.json" 2>/dev/null | jq -r '.version' || true)
          if [[ -z "$previous" || "$current" == "$previous" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release version: $current" >&2
            exit 1
          }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$current" >> "$GITHUB_OUTPUT"
      - name: Create tag and GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
